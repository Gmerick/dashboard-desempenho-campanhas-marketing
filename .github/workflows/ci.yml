name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate data SQL and workbook
        run: python -m unittest discover -s tests -v
      - name: Rebuild SQLite database
        run: python database/build_database.py
